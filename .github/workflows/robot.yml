name: Robot Framework CI

on:
  push:
    branches: [main]
    paths:
      - 'web/robot-framework/**'
      - '.github/workflows/robot.yml'
  pull_request:
    paths:
      - 'web/robot-framework/**'
      - '.github/workflows/robot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/robot-framework

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Robot Framework tests
        # saucedemo.com is a third-party site: re-run only the failed tests once, then merge the results
        run: |
          robot -d results -v HEADLESS:True tests/ || {
            robot -d results/rerun -v HEADLESS:True --rerunfailed results/output.xml tests/ || true
            rebot -d results --merge --output final.xml --log log.html --report report.html results/output.xml results/rerun/output.xml
          }

      - name: Summarise failures
        if: failure()
        run: |
          python scripts/ci_summary.py "$( [ -f results/final.xml ] && echo results/final.xml || echo results/output.xml )" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-framework-results
          path: web/robot-framework/results/
          if-no-files-found: warn
