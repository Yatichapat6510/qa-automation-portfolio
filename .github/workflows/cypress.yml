name: Cypress Tests

on:
  push:
    paths:
      - 'web/cypress/**'
      - '.github/workflows/cypress.yml'
  pull_request:
    paths:
      - 'web/cypress/**'
      - '.github/workflows/cypress.yml'

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run showcase specs (project-1-sauce-demo)
        uses: cypress-io/github-action@v6
        with:
          working-directory: web/cypress
          browser: chrome
          spec: cypress/e2e/1-getting-started/**/*.cy.js
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
