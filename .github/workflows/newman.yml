name: Newman API Tests

on:
  push:
    branches: [main]
    paths:
      - 'api/postman-newman/**'
      - '.github/workflows/newman.yml'
  pull_request:
    paths:
      - 'api/postman-newman/**'
      - '.github/workflows/newman.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: api/postman-newman

jobs:
  practice-api-tests:
    name: JSONPlaceholder API suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/postman-newman/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-report
          path: api/postman-newman/reports/newman-report.html
          if-no-files-found: warn
          retention-days: 14

  authenticated-restful-api:
    name: Authenticated restful-api.dev suite (optional)
    runs-on: ubuntu-latest
    env:
      RESTFUL_API_KEY: ${{ secrets.RESTFUL_API_KEY }}
    steps:
      # Secrets cannot be used in a job-level `if`, so each step checks the key itself.
      - uses: actions/checkout@v7
        if: ${{ env.RESTFUL_API_KEY != '' }}
      - uses: actions/setup-node@v7
        if: ${{ env.RESTFUL_API_KEY != '' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/postman-newman/package-lock.json
      - run: npm ci
        if: ${{ env.RESTFUL_API_KEY != '' }}
      - run: npm run test:restful-auth -- --env-var "apiKey=$RESTFUL_API_KEY"
        if: ${{ env.RESTFUL_API_KEY != '' }}
      - name: Upload authenticated HTML report
        if: ${{ always() && env.RESTFUL_API_KEY != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: restful-api-auth-html-report
          path: api/postman-newman/reports/restful-auth-report.html
          if-no-files-found: warn
          retention-days: 14
