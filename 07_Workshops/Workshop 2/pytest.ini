[pytest]
# ── ค้นหา Test Files ──────────────────────────────────
testpaths = tests

# ── รูปแบบ naming ที่ pytest จะรู้จัก ─────────────────
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# ── Default options ───────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Custom markers ────────────────────────────────────
markers =
    smoke:      Smoke tests (รันก่อนเสมอ)
    regression: Regression tests (รัน full suite)
    negative:   Negative / error path tests
    e2e:        End-to-end tests
