appId: com.saucelabs.mydemoapp.android
---
# Subflow: รอจนหน้า Products พร้อม โดยปิด pop-up ของระบบที่เด้งขึ้นมาก่อน
# dialog ของระบบทับหน้าแอป ทำให้ Maestro มองไม่เห็น element ของแอป จึงรอให้เห็น "อย่างใดอย่างหนึ่ง" ก่อน
# (text เป็น regex จึงใช้ | ได้) แล้วค่อยปิด pop-up และรอหน้า Products อีกรอบ
- extendedWaitUntil:
    visible: "Displays all products of catalog|Android App Compatibility|.*Allow.*"
    timeout: 15000
- runFlow: dismiss_system_popups.yaml
- extendedWaitUntil:
    visible: "Displays all products of catalog"
    timeout: 15000
