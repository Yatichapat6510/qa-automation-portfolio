appId: com.saucelabs.mydemoapp.android
name: "TC-MOB-003 Login with empty password"
tags:
  - login
  - negative
---
# [Negative] กรอกเฉพาะ Username แล้วกด Login ต้องแสดง error ที่ช่อง Password
- runFlow: subflows/open_login.yaml
# ไม่ใช้ subflow submit_login เพราะต้องเว้นช่อง Password ว่างไว้จริงๆ
- tapOn:
    id: "nameET"
- inputText: "bod@example.com"
- hideKeyboard
- tapOn: "Tap to login with given credentials"
- assertVisible:
    id: "passwordErrorTV"
    text: "Enter Password"
# ยังคงอยู่หน้า Login
- assertVisible: "Tap to login with given credentials"
- takeScreenshot: tc_mob_003_empty_password_error
