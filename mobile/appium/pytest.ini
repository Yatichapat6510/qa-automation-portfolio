[pytest]
# ให้ import config/ และ pages/ ได้โดยตรง ไม่ว่าจะรันจาก root ของ repo หรือจากโฟลเดอร์นี้
pythonpath = .
testpaths = tests
addopts = -v --strict-markers
markers =
    smoke: core happy-path checks
    login: login screen scenarios
    cart: cart and product scenarios
    known_defect: confirms a documented app defect (expected to fail until fixed)
