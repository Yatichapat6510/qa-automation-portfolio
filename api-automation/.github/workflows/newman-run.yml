name: Newman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  practice-api-tests:
    name: JSONPlaceholder API suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Newman tests
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: reports/newman-report.html
          if-no-files-found: warn
          retention-days: 14

  authenticated-restful-api:
    name: Authenticated restful-api.dev suite
    if: ${{ secrets.RESTFUL_API_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run authenticated Newman tests
        run: npm run test:restful-auth -- --env-var "apiKey=${{ secrets.RESTFUL_API_KEY }}"

      - name: Upload authenticated HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restful-api-auth-html-report
          path: reports/restful-auth-report.html
          if-no-files-found: warn
          retention-days: 14
